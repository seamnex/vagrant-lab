# Inventario del laboratorio.
#
# Se usa cuando corrés Ansible desde una máquina de control con acceso SSH a
# las VMs (Linux/WSL/macOS). Con el provisioner `ansible_local` del Vagrantfile
# no hace falta: Vagrant genera su propio inventario dentro de cada VM.
#
# Para obtener las claves SSH que espera este archivo:
#     vagrant ssh-config

# El grupo NO se llama `monitor` a propósito: el host ya se llama así, y un
# grupo homónimo hace que Ansible avise (`Found both group and host with same
# name`) y que `hosts: monitor` quede ambiguo.

[app]
app-01 ansible_host=192.168.56.11
app-02 ansible_host=192.168.56.12

[monitoreo]
monitor ansible_host=192.168.56.20

[all:vars]
ansible_user=vagrant
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
